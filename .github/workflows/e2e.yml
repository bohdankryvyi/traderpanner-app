name: e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traderplanner
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trader -d traderplanner"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            app-frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend deps
        working-directory: app-frontend
        run: npm ci

      - name: Build frontend
        working-directory: app-frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Start backend
        working-directory: app-backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: traderplanner
          DB_USER: trader
          DB_PASSWORD: trader
          # Safe default in CI; avoids any environment timezone weirdness
          JAVA_TOOL_OPTIONS: -Duser.timezone=UTC
          # AI keys empty in CI; pattern endpoint returns 200 fallback, E2E unaffected
          OPENAI_API_KEY: ""
          ALPHAVANTAGE_API_KEY: ""
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests spring-boot:run > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "http://localhost:8080/actuator/health" 2>/dev/null || echo "000")
            if [ "$code" = "200" ] && grep -q '"status":"UP"' /tmp/health.json 2>/dev/null; then
              echo "Backend is up (actuator/health UP)"
              exit 0
            fi
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:8080/swagger-ui/index.html" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "Backend is up (swagger-ui fallback)"
              exit 0
            fi
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:8080/api/trading" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "Backend is up (api/trading fallback)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          echo "---- backend.log (last 200 lines) ----"
          tail -n 200 app-backend/backend.log || true
          exit 1

      - name: Start frontend
        working-directory: app-frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if code=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:5173") && [ "$code" = "200" ]; then
              echo "Frontend is up (HTTP 200)"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not start in time"
          echo "---- frontend.log (last 200 lines) ----"
          tail -n 200 app-frontend/frontend.log || true
          exit 1

      - name: Run Playwright tests
        working-directory: e2e
        env:
          # Your e2e config already uses baseURL 5173; API calls go to 8080
          BASE_URL: http://localhost:5173
          API_BASE_URL: http://localhost:8080
        run: npm run test

      - name: Show app logs on failure
        if: failure()
        run: |
          echo "---- backend.log (last 200 lines) ----"
          tail -n 200 app-backend/backend.log 2>/dev/null || true
          echo "---- frontend.log (last 200 lines) ----"
          tail -n 200 app-frontend/frontend.log 2>/dev/null || true

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      # App logs: backend/frontend stdout. No secrets are logged (API keys come from env and are not printed).
      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: |
            app-backend/backend.log
            app-frontend/frontend.log
          if-no-files-found: ignore

      - name: Stop processes (always)
        if: always()
        run: |
          for role in frontend backend; do
            dir="app-$role"
            pidfile="$dir/$role.pid"
            if [ -f "$pidfile" ]; then
              pid=$(cat "$pidfile")
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                pkill -P "$pid" 2>/dev/null || true
                kill "$pid" 2>/dev/null || true
              fi
              rm -f "$pidfile"
            fi
          done
